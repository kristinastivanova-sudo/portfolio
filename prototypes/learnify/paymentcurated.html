<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learnify — Payment (curated course)</title>
<meta name="description" content="Kristina Gaytandzhieva — growth marketing and product design portfolio.">
<meta name="robots" content="noindex">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">

<style>body{margin:0} a{color:inherit} input::placeholder{color:#818182}</style>

<style>html{-webkit-text-size-adjust:100%}img{max-width:100%}
body{background:#E9E9F0}
#root{max-width:430px;margin:0 auto;min-height:100vh;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 20px 60px rgba(0,0,0,.12);background:#fff}
@media (max-width:480px){body{background:#fff}#root{box-shadow:none}}.pf-back{position:fixed;left:16px;bottom:16px;z-index:9999;background:#300045;color:#FFFDFA !important;font:600 14px/1 system-ui,sans-serif;padding:12px 16px;border-radius:999px;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}.pf-back:hover{background:#4a0a66}</style>

</head>
<body>
<div id="root">

<div style="width: 393px; height: 940px; box-sizing: border-box; background: #FBFBFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif; color: #01011C; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 48px 12px 8px; display: flex; align-items: center; gap: 4px; background: #FFFFFF; border-bottom: 1px solid #E2E2E3">
<a href="detail.html" aria-label="Back to course" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#01011C" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
<span style="font-size: 17px; font-weight: 700">Payment</span>
</header>

<div style="flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 18px">
<section aria-label="Order summary" style="background: #FFFFFF; border: 1px solid #E2E2E3; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 16px; font-weight: 700">Mobile UI Essentials</span>
<span style="font-size: 14px; color: #535354">Curated</span>
</div>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #535354"><span>4-week course</span><span>$129</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #535354"><span>2 mentor check-ins</span><span>Included</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #E2E2E3; padding-top: 10px"><span style="font-size: 15px; font-weight: 700">Total</span><span style="font-size: 20px; font-weight: 800">$129</span></div>
</section>

<a href="success.html" style="background: #01011C; color: #FFFFFF; text-decoration: none; border-radius: 14px; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2-1.1 2.8-2.3.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-.9-2.5-3.8zM14.2 5.8c.6-.8 1.1-1.8 1-2.8-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-1 2.7 1 .1 2-.5 2.6-1.3z"></path></svg>
Pay with Apple Pay
</a>

<div style="display: flex; align-items: center; gap: 12px; font-size: 14px; color: #535354"><span style="flex: 1; height: 1px; background: #E2E2E3"></span>or pay by card<span style="flex: 1; height: 1px; background: #E2E2E3"></span></div>

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="c-name" style="font-size: 14px; font-weight: 600">Name on card</label>
<input id="c-name" placeholder="Bobby Ivanov" style="height: 48px; border: 1px solid #B9B9BA; border-radius: 12px; padding: 0 14px; font: 400 16px -apple-system, system-ui, sans-serif; color: #01011C; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="c-card" style="font-size: 14px; font-weight: 600">Card number</label>
<input id="c-card" inputmode="numeric" placeholder="1234 5678 9012 3456" style="height: 48px; border: 1px solid #B9B9BA; border-radius: 12px; padding: 0 14px; font: 400 16px -apple-system, system-ui, sans-serif; color: #01011C; background: #FFFFFF">
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="c-exp" style="font-size: 14px; font-weight: 600">Expiry</label>
<input id="c-exp" placeholder="MM / YY" style="height: 48px; border: 1px solid #B9B9BA; border-radius: 12px; padding: 0 14px; font: 400 16px -apple-system, system-ui, sans-serif; color: #01011C; background: #FFFFFF; min-width: 0">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="c-cvc" style="font-size: 14px; font-weight: 600">CVC</label>
<input id="c-cvc" inputmode="numeric" placeholder="123" style="height: 48px; border: 1px solid #B9B9BA; border-radius: 12px; padding: 0 14px; font: 400 16px -apple-system, system-ui, sans-serif; color: #01011C; background: #FFFFFF; min-width: 0">
</div>
</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<a href="success.html" style="background: #93E078; color: #01011C; text-decoration: none; border-radius: 14px; min-height: 52px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Pay $129</a>
<div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: #535354">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#535354" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>
Secure payment · one-time charge, no subscription
</div>
</div>
</div>
</div>
</div>
<a class="pf-back" href="../../learnify.html">← Back to case study</a>


</body>
</html>
