<script>
/* Tiny template runtime: renders <template id="dc-tpl"> with {{ holes }}, <sc-for>, <sc-if>
   and on* event bindings from a Component's renderVals(). Re-renders on setState. */
var DC = (function () {
  var inst = null, tpl = null, root = null;
  function ev(expr, scope) {
    var k = Object.keys(scope);
    try { return new Function(k.join(','), 'return (' + expr + ')').apply(null, k.map(function (x) { return scope[x]; })); }
    catch (e) { return ''; }
  }
  function sub(str, scope) {
    var m = str.match(/^\s*\{\{([\s\S]*?)\}\}\s*$/);
    if (m) return ev(m[1], scope);
    return str.replace(/\{\{([\s\S]*?)\}\}/g, function (_, e) { var v = ev(e, scope); return v == null ? '' : v; });
  }
  var BOOL = { checked: 1, disabled: 1, selected: 1, hidden: 1, open: 1, required: 1 };
  function proc(node, scope) {
    var kids = Array.prototype.slice.call(node.childNodes);
    for (var i = 0; i < kids.length; i++) {
      var ch = kids[i];
      if (ch.nodeType === 3) { if (ch.data.indexOf('{{') > -1) { var v = sub(ch.data, scope); ch.data = v == null ? '' : String(v); } continue; }
      if (ch.nodeType !== 1) continue;
      var t = ch.tagName.toLowerCase();
      if (t === 'sc-for') {
        var lst = sub(ch.getAttribute('list'), scope) || [], as = ch.getAttribute('as') || 'item', frag = document.createDocumentFragment();
        for (var j = 0; j < lst.length; j++) {
          var w = document.createElement('div');
          for (var c = 0; c < ch.childNodes.length; c++) w.appendChild(ch.childNodes[c].cloneNode(true));
          var s2 = Object.assign({}, scope); s2[as] = lst[j]; s2.index = j;
          proc(w, s2);
          while (w.firstChild) frag.appendChild(w.firstChild);
        }
        ch.parentNode.replaceChild(frag, ch); continue;
      }
      if (t === 'sc-if') {
        if (sub(ch.getAttribute('value'), scope)) {
          var w2 = document.createElement('div');
          while (ch.firstChild) w2.appendChild(ch.firstChild);
          proc(w2, scope);
          var f2 = document.createDocumentFragment();
          while (w2.firstChild) f2.appendChild(w2.firstChild);
          ch.parentNode.replaceChild(f2, ch);
        } else ch.parentNode.removeChild(ch);
        continue;
      }
      var attrs = Array.prototype.slice.call(ch.attributes);
      for (var a = 0; a < attrs.length; a++) {
        var name = attrs[a].name, val = attrs[a].value;
        if (val.indexOf('{{') < 0) continue;
        var r = sub(val, scope);
        if (/^on/i.test(name)) {
          ch.removeAttribute(name);
          if (typeof r === 'function') {
            var evt = name.slice(2).toLowerCase();
            if (evt === 'doubleclick') evt = 'dblclick';
            ch.addEventListener(evt, (function (fn) { return function (e) { fn(e); }; })(r));
          }
          continue;
        }
        if (BOOL[name.toLowerCase()]) {
          if (r && r !== 'false') ch.setAttribute(name, ''); else ch.removeAttribute(name);
          continue;
        }
        if (name === 'data-dc-src') { ch.removeAttribute(name); name = 'src'; }
        if (r === false || r == null) ch.removeAttribute(name); else ch.setAttribute(name, String(r));
      }
      proc(ch, scope);
    }
  }
  function render() {
    var vals = inst.renderVals() || {};
    var holder = document.createElement('div');
    holder.appendChild(tpl.content.cloneNode(true));
    proc(holder, vals);
    root.innerHTML = '';
    while (holder.firstChild) root.appendChild(holder.firstChild);
  }
  window.DCLogic = function (p) { this.props = p || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (s) {
    Object.assign(this.state, typeof s === 'function' ? s(this.state, this.props) : s);
    if (inst === this) render();
  };
  return {
    mount: function (C, props) {
      tpl = document.getElementById('dc-tpl'); root = document.getElementById('root');
      inst = new C(props || {});
      if (inst.componentDidMount) { render(); inst.componentDidMount(); } else render();
    }
  };
})();


class Component extends DCLogic {
  constructor(p) { super(p); this.state = { done: { a: true, b: true, c: false, d: false } }; }
  renderVals() {
    const list = [
      { id: 'a', title: 'Who is your audience?', meta: 'Video · 25 min' },
      { id: 'b', title: 'Building a persona', meta: 'Video + template · 40 min' },
      { id: 'c', title: 'Segmenting your market', meta: 'Video · 30 min' },
      { id: 'd', title: 'Quiz: audiences', meta: '10 min' }
    ];
    const d = this.state.done;
    const lessons = list.map((l) => {
      const on = !!d[l.id];
      return Object.assign({}, l, {
        isDone: on, checked: on ? 'true' : 'false',
        toggle: () => this.setState({ done: Object.assign({}, d, { [l.id]: !on }) }),
        boxStyle: 'flex: 0 0 24px; height: 24px; border-radius: 999px; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #588A48;' : 'border: 2px solid #B9B9BA;'),
        titleStyle: 'font-size: 15px; font-weight: 600; ' + (on ? 'color: #535354; text-decoration: line-through;' : 'color: #01011C;')
      });
    });
    const done = list.filter((l) => d[l.id]).length;
    const next = list.find((l) => !d[l.id]);
    const c = 2 * Math.PI * 26;
    return {
      lessons, done,
      dash: (c * done / 4).toFixed(1) + ' ' + c.toFixed(1),
      doneLabel: done + ' of 4 lessons done this week',
      goalLine: done === 4 ? 'All done. Nice work!' : (4 - done) + ' lessons left · about 1.5 h',
      nextTitle: next ? next.title : 'Apply it'
    };
  }
}

DC.mount(Component, {});
</script>
